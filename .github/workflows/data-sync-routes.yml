name: Sync bus route data

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
  workflow_dispatch:
    inputs:
      force_cities:
        description: 'Force regeneration (space-separated slugs or "all")'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Opt-in, not opt-out: this assumes a specific deploy story (self-hosted
    # over SSH + docker-compose, see the "Deploy to server" step below) and
    # a specific data flow (city data checked into this repo) that not
    # every fork wants - same spirit as the analytics/custom backend
    # extension points (frontend/src/custom/), which also default to off
    # until a deployment deliberately activates them. Manual runs
    # (workflow_dispatch) always work regardless, so a deployment can test
    # this before committing to the nightly schedule; the schedule trigger
    # itself is a no-op until OSM_ROUTES_SYNC_ENABLED is set to "true" in
    # Settings -> Actions -> Variables.
    if: github.event_name == 'workflow_dispatch' || vars.OSM_ROUTES_SYNC_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      # frontend: package-lock.json only carries the optional native
      # rolldown binding for whatever OS last ran `npm install` locally
      # (macOS, for this repo) - npm has a bug (npm/cli#4828) where even
      # `npm install` won't backfill a missing platform's binding from an
      # existing lockfile, only a from-scratch resolve does. Deleting it
      # only affects this ephemeral checkout, not the committed lockfile.
      # services/routing has its own lockfile with no such native deps, so
      # npm ci is fine there.
      - name: Install Node dependencies
        run: |
          cd services/routing && npm ci
          cd ../.. && rm -f package-lock.json && cd frontend && npm install

      - name: Check for OSM route changes
        id: check
        env:
          # See the matching DEPLOY_PATH pattern in the deploy step below -
          # a per-deployment tuning knob (how many OSM-synthetic cities it
          # has, how conservative it wants to be with the shared public
          # Overpass instance), set once in Settings -> Actions ->
          # Variables instead of editing this file.
          OSM_SYNC_SLEEP_SECONDS: ${{ vars.OSM_SYNC_SLEEP_SECONDS || '5' }}
        run: python3 pipeline/check_osm_routes.py

      - name: Resolve cities to regenerate
        id: cities
        run: |
          ALL_CITIES=$(python3 -c "import glob,json,os; print(' '.join(json.load(open(p))['slug'] for p in glob.glob('config/cities/*.json') if os.path.basename(p) != '_countries.json'))")
          FORCED="${{ inputs.force_cities }}"
          if [ "$FORCED" = "all" ]; then
            CITIES="$ALL_CITIES"
          elif [ -n "$FORCED" ]; then
            CITIES="$FORCED"
          else
            CITIES="${{ steps.check.outputs.cities_changed }}"
          fi
          echo "list=$CITIES" >> $GITHUB_OUTPUT
          if [ -n "$CITIES" ]; then
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "any=false" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate GTFS + routes.json + stops.json
        if: steps.cities.outputs.any == 'true'
        run: |
          for city in ${{ steps.cities.outputs.list }}; do
            echo "── $city ──"
            python3 pipeline/osm_to_gtfs.py --city "$city"
            python3 pipeline/gtfs_routes_to_json.py --city "$city"
            python3 pipeline/gtfs_stops_to_json.py --city "$city"
          done

      - name: Regenerate transit binaries (timetable.bin + stops.bin)
        if: steps.cities.outputs.any == 'true'
        run: cd frontend && npm run generate-transit-data

      - name: Build frontend
        if: steps.cities.outputs.any == 'true'
        run: cd frontend && npm run build

      - name: Setup SSH
        if: steps.cities.outputs.any == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        if: steps.cities.outputs.any == 'true'
        env:
          # Repo variable (Settings → Actions → Variables), not a file edit -
          # every deployment self-hosting via SSH+rsync+docker-compose (this
          # workflow's whole model) still picks its own remote directory
          # name; this is the one thing that varies even among deployments
          # using the exact same deploy story. A genuinely different deploy
          # story (Kubernetes, Vercel, ...) means writing your own workflow -
          # already the expectation for framework-owned CI files.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/app' }}
        run: |
          SRV="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          rsync -az --delete frontend/dist/    $SRV:$DEPLOY_PATH/frontend/dist/
          rsync -az            data/cities/    $SRV:$DEPLOY_PATH/data/cities/
          rsync -az            services/routing/ $SRV:$DEPLOY_PATH/services/routing/
          ssh $SRV "cd $DEPLOY_PATH && \
            docker compose build routing-serve && \
            docker compose up -d routing-serve && \
            docker compose restart web"

      - name: Commit updated data
        if: steps.cities.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/ data/gtfs/
          git diff --staged --quiet || \
            git commit -m "data: auto-sync OSM routes (${{ steps.cities.outputs.list }}) [skip ci]"
          git push
