name: Sync POI data

on:
  schedule:
    - cron: '0 3 1 * *'   # 3am UTC on the 1st of each month
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      # package-lock.json only carries the optional native rolldown binding
      # for whatever OS last ran `npm install` locally (macOS, for this
      # repo) - npm has a bug (npm/cli#4828) where even `npm install` won't
      # backfill a missing platform's binding from an existing lockfile,
      # only a from-scratch resolve does. Deleting it only affects this
      # ephemeral checkout, not the committed lockfile.
      - name: Install Node dependencies
        run: cd frontend && rm -f ../package-lock.json && npm install

      - name: Regenerate POIs for all cities
        run: |
          CITIES=$(python3 -c "import json; print(' '.join(c['slug'] for c in json.load(open('config/cities.json'))['cities']))")
          for city in $CITIES; do
            echo "── POIs $city ──"
            python3 pipeline/osm_to_pois.py --city "$city"
          done

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          # See the matching step in data-sync-routes.yml for why this is a
          # repo variable, not hardcoded.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/app' }}
        run: |
          SRV="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          rsync -az --delete frontend/dist/    $SRV:$DEPLOY_PATH/frontend/dist/
          rsync -az           data/cities/     $SRV:$DEPLOY_PATH/data/cities/
          ssh $SRV "cd $DEPLOY_PATH && docker compose restart web"

      - name: Commit updated POI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/
          git diff --staged --quiet || \
            git commit -m "data: auto-sync OSM POIs [skip ci]"
          git push
